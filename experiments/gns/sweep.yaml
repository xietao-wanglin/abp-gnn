method: random
program: main.py

parameters:
  model:
    parameters:
      hidden_nf:
        values: [16, 64, 256]
      n_layers:
        values: [1, 4, 8]
      encoder_depth:
        values: [1, 2, 4]
      decoder_depth:
        values: [1, 2, 4]
      dropout:
        values: [0.0, 0.1]

  train:
    parameters:
      lr:
        values: [0.01, 0.001, 0.0005, 0.0001]
      weight_decay:
        values: [0.001, 0.00001, 0.00000001]

command:
  - ${env}
  - python
  - ${program}
  - experiments/gnn/cfg.yaml