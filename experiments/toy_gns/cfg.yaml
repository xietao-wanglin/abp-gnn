seed: 1
dtype: "float"

dataset: "toy_periodic"

wandb:
  name: "toy_gns"
  track_gradients: true
  gradients_every: 125

model:
  name: "GNS"
  n_layers: 4
  in_node_nf: 1
  out_node_nf: 2
  in_edge_nf: 3
  hidden_nf: 64
  encoder_depth: 2
  decoder_depth: 2
  edge_mlp_depth: 2
  node_mlp_depth: 2
  dropout: 0.0
  norm: false
  n_particle_types: 1
  particle_embedding: 16
  activation: "silu"
  aggr: "sum"

train:
  lr: 1e-3
  lr_final: 1e-6
  lr_decay_steps: 5e6
  weight_decay: 1e-8
  batch_size: 32
  n_steps: 20000
  checkpoint_every: 500
  log_steps: 1
  base_model_path: null

val:
  batch_size: 200
  log_steps: 500

test:
  active: true
  log_steps: 500

data:
  subset: true
  subset_samples: [0]
  cluster:
    method: "radius"
    parameter: 100.0
  features:
    use_distance: true
    use_rel_pos: true
    use_pos: false
    use_angle: true
    use_rel_angle: false
    target_vel: true
    separate_coords: false
  boundary_type: [1, 1, 1]
  box_length: 1.0
  noise_std: 0
