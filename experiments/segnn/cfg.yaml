seed: 1
dtype: "float"

dataset: "chiral"

wandb:
  name: "chiral_segnn"
  track_gradients: false
  gradients_every: 125

model:
  name: "SEGNN"
  n_layers: 5
  in_node_nf: 0
  out_node_nf: 2
  in_edge_nf: 1
  hidden_nf: 128
  hidden_irreps: "32x0e + 32x1o"
  encoder_depth: 2
  decoder_depth: 2
  edge_mlp_depth: 2
  node_mlp_depth: 2
  dropout: 0.0
  norm: true
  n_particle_types: 2
  particle_embedding: 16
  activation: "silu"
  aggr: "sum"

train:
  lr: 1e-4
  lr_final: 1e-6
  lr_decay_steps: 5e6
  weight_decay: 1e-8
  batch_size: 32
  n_steps: 1000000
  checkpoint_every: 2000
  log_steps: 1
  base_model_path: null

val:
  batch_size: 200
  log_steps: 2000

test:
  active: false
  log_steps: 2000

data:
  subset: true
  subset_samples: [0]
  cluster:
    method: "radius"
    parameter: 0.1
  features:
    use_distance: true
    use_rel_pos: false
    use_pos: false
    use_angle: false
    use_rel_angle: false
    target_vel: true
    separate_coords: true
  boundary_type: [1, 1, 1]
  box_length: 0.4
  noise_std: 0
  
