method: random
program: main.py

parameters:
  model:
    parameters:
      hidden_nf:
        values: [8, 32, 64, 128]
      n_layers:
        values: [1, 2, 3, 4]
      encoder_depth:
        values: [1, 2, 3, 4]
      decoder_depth:
        values: [1, 2, 3, 4]
      edge_mlp_depth:
        values: [1, 2, 3, 4]
      node_mlp_depth:
        values: [1, 2, 3, 4]


command:
  - ${env}
  - python
  - ${program}
  - experiments/gnn/cfg.yaml