seed: 1

dataset: "nonchiral_lj_noise"

wandb:
  name: "gnn"
  track_gradients: false
  gradients_every: 125

model:
  name: "GNN"
  n_layers: 4
  in_node_nf: 2
  out_node_nf: 2
  in_edge_nf: 0
  hidden_nf: 64
  encoder_depth: 2
  decoder_depth: 3
  edge_mlp_depth: 2
  node_mlp_depth: 2
  dropout: 0.0
  norm: false
  activation: "silu"

train:
  lr: 1e-3
  weight_decay: 1e-8
  batch_size: 32
  n_steps: 20000
  checkpoint_every: 250
  log_steps: 1
  base_model_path: null

val:
  batch_size: 200
  log_steps: 250

test:
  log_steps: 250

data:
  subset: true
  subset_samples: [0, 20, 40, 60]
  cluster:
    method: "radius"
    parameter: 10.0
  features:
    use_distance: false
    use_rel_pos: false
    use_pos: true
    target_vel: true
  boundary_type: [1, 1, 1]
