seed: 1

dataset: "abp_toy"

wandb:
  name: "abp-stochastic"
  track_gradients: true
  gradients_every: 125

model:
  name: "S-GNS"
  n_layers: 4
  in_node_nf: 1
  out_node_nf: 3
  in_edge_nf: 3
  hidden_nf: 64
  encoder_depth: 2
  decoder_depth: 2
  edge_mlp_depth: 2
  node_mlp_depth: 2
  dropout: 0.0
  norm: false
  n_particle_types: 1
  particle_embedding: 16
  activation: "silu"

train:
  lr: 1e-4
  weight_decay: 0
  batch_size: 64
  n_steps: 40000
  checkpoint_every: 250
  log_steps: 1
  base_model_path: null

val:
  batch_size: 200
  log_steps: 250

test:
  active: false
  log_steps: 250

data:
  subset: false
  subset_samples: null
  cluster:
    method: "radius"
    parameter: 0.1
  features:
    use_distance: true
    use_rel_pos: true
    use_pos: false
    use_angle: true
    target_vel: true
  boundary_type: [1, 1, 1]
